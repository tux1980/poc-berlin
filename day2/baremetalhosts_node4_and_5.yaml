apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: ocp4-node4
  namespace: openshift-machine-api
  annotations:
    inspect.metal3.io: disabled
spec:
  online: true
  externallyProvisioned: false
  bootMACAddress: "52:54:00:b2:03:ce"
  networkData:
    name: ocp4-node4-network-data
  bmc:
    address: "ipmi://192.168.60.1:6237"
    credentialsName: ocp4-node4-bmc-secret
  bootMode: UEFI
  automatedCleaningMode: disabled
  rootDeviceHints:
    deviceName: "/dev/vda"
---
