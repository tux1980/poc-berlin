apiVersion: metal3.io/v1alpha1
kind: BareMetalHost
metadata:
  name: ocp4-node1.pb-poc.ocp.polizei.test
  namespace: openshift-machine-api
  annotations:
    inspect.metal3.io: disabled # Skips hardware inspection to prevent unexpected reboots
spec:
  online: true
  externallyProvisioned: true # Crucial for active control-plane nodes deployed via Agent Installer
  #bootMACAddress: "52:54:00:02:2d:fd"
  bmc:
    address: "ipmi://192.168.60.1:6234" # VirtualBMC endpoint on storm4
    credentialsName: ocp4-node1-bmc-secret
  bootMode: UEFI
  automatedCleaningMode: disabled
  rootDeviceHints:
    deviceName: "/dev/vda"
---
