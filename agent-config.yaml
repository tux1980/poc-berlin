apiVersion: v1beta1
kind: AgentConfig
metadata:
  name: pb-poc
rendezvousIP: 192.168.60.11
hosts:
  # =========================================================================
  # Node 1 (Master 0) - ocp4-node1
  # =========================================================================
  - hostname: ocp4-node1.pb-poc.ocp.polizei.test
    role: master
    rootDeviceHints:
      deviceName: "/dev/vda"
    interfaces:
      - name: enp1s0
        macAddress: "52:54:00:aa:bb:01" # Leg 1 (KVM ocp-net)
      - name: enp10s0
        macAddress: "52:54:00:aa:bb:21" # Leg 2 (KVM ocp-net)
      - name: enp8s0
        macAddress: "52:54:00:5c:b6:a3" # KVM vtn-net
      - name: enp9s0
        macAddress: "52:54:00:02:2d:fd" # KVM provisioning-net
    networkConfig:
      interfaces:
        # 1. VLAN 40 on top of the bond0 interface (Machine Network)
        - name: bond0.40
          type: vlan
          state: up
          vlan:
            base-iface: bond0
            id: 40
          ipv4:
            enabled: true
            address:
              - ip: 192.168.60.11
                prefix-length: 24
            dhcp: false

        # 2. Underlying active-backup bond
        - name: bond0
          type: bond
          state: up
          mac-address: "52:54:00:aa:bb:01"
          ipv4:
            enabled: false
          ipv6:
            enabled: false
          link-aggregation:
            mode: active-backup
            options:
              miimon: "100"
            port:
              - enp1s0
              - enp10s0

        # 3. VLAN 100 on top of physical interface enp8s0 (vtn-net / VM Network)
        - name: enp8s0.100
          type: vlan
          state: up
          vlan:
            base-iface: enp8s0
            id: 100
          ipv4:
            enabled: true
            address:
              - ip: 192.168.70.11
                prefix-length: 24
            dhcp: false

        # 4. Disable base physical interfaces to prevent DHCP leaks
        - name: enp8s0
          type: ethernet
          state: up
          ipv4:
            enabled: false
          ipv6:
            enabled: false
        - name: enp9s0
          type: ethernet
          state: up
          ipv4:
            enabled: false
          ipv6:
            enabled: false
      dns-resolver:
        config:
          server:
            - 192.168.60.1
      routes:
        config:
          - destination: 0.0.0.0/0
            next-hop-address: 192.168.60.1
            next-hop-interface: bond0.40

