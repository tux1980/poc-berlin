apiVersion: mirror.openshift.io/v2alpha1
kind: ImageSetConfiguration
mirror:
  platform:
    graph: true
    channels:
      - name: stable-4.22
        minVersion: 4.22.18
        #maxVersion: 4.22.20

  operators:
    # Offizielle Red Hat Operatoren!
    - catalog: registry.redhat.io/redhat/redhat-operator-index:v4.22
      packages:
        - name: kubevirt-hyperconverged
        - name: cincinnati-operator
        - name: kubernetes-nmstate-operator
        - name: nfd
        - name: cluster-kube-descheduler-operator
        - name: mtv-operator
        - name: redhat-oadp-operator
        - name: cluster-logging
        - name: advanced-cluster-management
        - name: node-healthcheck-operator
        - name: fence-agents-remediation
        - name: self-node-remediation
        - name: multicluster-engine
        - name: openshift-gitops-operator
        - name: openshift-cert-manager-operator
        - name: netobserv-operator
        - name: loki-operator
        - name: sriov-network-operator
        - name: metallb-operator

#    - catalog: registry.redhat.io/redhat/community-operator-index:v4.22
#      packages:
#        - name: trident-operator
#          channels:
#          - name: stable

    - catalog: registry.redhat.io/redhat/certified-operator-index:v4.22
      packages:
        - name: trident-operator
          channels:
          - name: stable
        - name: k10-kasten-operator-rhmp
          channels:                                        
          - name: stable
    
  additionalImages:
    # NFS Stuff
    - name: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2

    # NetApp Trident Core & Operator Images direkt von quay.io und docker.io (Version 26.06.1)
    - name: quay.io/netapp/trident-operator:26.06.2
    - name: quay.io/netapp/trident:26.06.2
    - name: docker.io/netapp/trident-autosupport:26.06

    # Required Kubernetes CSI Sidecars für NetApp Trident Storage Provider
    - name: registry.k8s.io/sig-storage/csi-provisioner:v6.3.0
    - name: registry.k8s.io/sig-storage/csi-attacher:v4.11.0
    - name: registry.k8s.io/sig-storage/csi-resizer:v2.1.0
    - name: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0
    - name: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.17.0
    - name: registry.k8s.io/sig-storage/livenessprobe:v2.15.0
    - name: nicolaka/netshoot:latest
    - name: registry.redhat.io/ubi9/ubi-minimal:latest
    - name: registry.redhat.io/ubi10/ubi:latest
    - name: docker.io/library/busybox:latest
